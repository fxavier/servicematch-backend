services:
  postgres:
    image: postgres:16-alpine
    container_name: servicematch-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicematch}
      POSTGRES_USER: ${POSTGRES_USER:-servicematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servicematch}
    volumes:
      - servicematch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servicematch} -d ${POSTGRES_DB:-servicematch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: servicematch-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-servicematch}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-servicematch}
    volumes:
      - servicematch_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  servicematch_postgres_data:
  servicematch_rabbitmq_data:
