spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:servicematch_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    placeholders:
      timestamp_tz: timestamp
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  jpa:
    hibernate:
      ddl-auto: none

management:
  endpoint:
    health:
      show-details: never
