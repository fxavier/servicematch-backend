spring:
  application:
    name: servicematch-backend
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
  profiles:
    active: dev

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-chars}
    issuer: servicematch-backend
    ttl-seconds: 3600
  session:
    refresh-ttl-seconds: 2592000
