spring:
  application:
    name: servicematch-backend
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
    placeholders:
      timestamp_tz: timestamptz
  profiles:
    active: dev
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:servicematch}
    password: ${RABBITMQ_PASSWORD:servicematch}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-chars}
    issuer: servicematch-backend
    ttl-seconds: 3600
  session:
    refresh-ttl-seconds: 2592000

messaging:
  exchange: servicematch.events
  profiles:
    user-registered-queue: profiles.user-registered
